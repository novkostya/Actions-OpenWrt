name: Build MX5500 AP

# Linksys MX5500 access point / VRRP backup router image (mx5500/build.sh): OpenWrt ImageBuilder,
# extra packages from mx5500/packages.txt, a slim sing-box and the shared overlay files.
# All versions are pinned in mx5500/versions.env (no inputs), so a release maps to one commit.
# Manual only: the daily update checker's repository_dispatch is for the x86 VM image.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Go
      uses: actions/setup-go@main
      with:
        go-version: '1.26'
        cache: false

    - name: ImageBuilder prerequisites
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential gawk gettext libncurses-dev python3 rsync unzip zstd file wget patch xz-utils

    - name: Build
      env:
        OUT_DIR: ${{ github.workspace }}/out
      run: ./mx5500/build.sh

    - name: Release tag
      id: tag
      run: |
        . mx5500/versions.env
        echo "openwrt_version=$OPENWRT_VERSION" >> $GITHUB_OUTPUT
        echo "release_tag=mx5500_${OPENWRT_VERSION}_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Release notes
      run: |
        { echo '```'; cat out/BUILDINFO; echo; cat out/sha256sums; echo '```'; } > out/RELEASE.md

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: MX5500 AP ${{ steps.tag.outputs.openwrt_version }} (${{ steps.tag.outputs.release_tag }})
        body_path: out/RELEASE.md
        # keep releases/latest pointing at the x86 VM image (README / recreate script use it)
        make_latest: false
        files: |
          out/*sysupgrade.bin
          out/*factory.bin
          out/*.manifest
          out/sha256sums
          out/BUILDINFO

    - name: Remove old MX5500 releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 3
        delete_tags: true
        delete_tag_pattern: '^mx5500_'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
