name: Build MX5500 AP

# Linksys MX5500 access point / VRRP backup router image (mx5500/build.sh): OpenWrt ImageBuilder,
# extra packages from mx5500/packages.txt, a slim sing-box and the shared overlay files.
# Manual only: the daily update checker's repository_dispatch is for the x86 VM image.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release'
        required: true
        default: '25.12.5'
        type: string
      singbox_tag:
        description: 'sing-box tag'
        required: true
        default: 'v1.14.2'
        type: string
      singbox_commit:
        description: 'Expected commit of that sing-box tag'
        required: true
        default: 'af6e64c3b69e6132ebaee0e1a3d24e93903f6709'
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Set up Go
      uses: actions/setup-go@main
      with:
        go-version: '1.26'
        cache: false

    - name: ImageBuilder prerequisites
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential gawk gettext libncurses-dev python3 rsync unzip zstd file wget patch xz-utils

    - name: Build
      env:
        OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version }}
        SINGBOX_TAG: ${{ github.event.inputs.singbox_tag }}
        SINGBOX_COMMIT: ${{ github.event.inputs.singbox_commit }}
        OUT_DIR: ${{ github.workspace }}/out
      run: ./mx5500/build.sh

    - name: Release tag
      id: tag
      run: echo "release_tag=mx5500_${{ github.event.inputs.openwrt_version }}_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Release notes
      run: |
        { echo '```'; cat out/BUILDINFO; echo; cat out/sha256sums; echo '```'; } > out/RELEASE.md

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: MX5500 AP ${{ github.event.inputs.openwrt_version }} (${{ steps.tag.outputs.release_tag }})
        body_path: out/RELEASE.md
        # keep releases/latest pointing at the x86 VM image (README / recreate script use it)
        make_latest: false
        files: |
          out/*sysupgrade.bin
          out/*factory.bin
          out/*.manifest
          out/sha256sums
          out/BUILDINFO

    - name: Remove old MX5500 releases
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 3
        delete_tags: true
        delete_tag_pattern: '^mx5500_'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
