name: Build OpenWrt

# x86-64 router VM image (./build.sh x86): OpenWrt ImageBuilder, extra packages from x86/packages.txt,
# the upstream sing-box build and the shared overlay files plus x86/files.
# All versions are pinned in x86/versions.env (no inputs), so a release maps to one commit.
# Releases come from the default branch only; a run on another branch uploads a test build as an artifact.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: ImageBuilder prerequisites
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install build-essential gawk gettext libncurses-dev python3 rsync unzip zstd file wget patch xz-utils

    - name: Build
      run: ./build.sh x86

    - name: Release tag
      id: tag
      run: |
        . x86/versions.env
        echo "release_tag=v${OPENWRT_VERSION}_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT

    - name: Release notes
      run: |
        { echo '```'; cat .build/x86/out/BUILDINFO; echo; cat .build/x86/out/sha256sums; echo '```'; } > .build/x86/RELEASE.md

    - name: Upload test build
      if: github.ref_name != github.event.repository.default_branch
      uses: actions/upload-artifact@main
      with:
        name: x86_${{ steps.tag.outputs.release_tag }}
        path: .build/x86/out
        retention-days: 7

    - name: Upload to Release
      if: github.ref_name == github.event.repository.default_branch
      uses: softprops/action-gh-release@master
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        target_commitish: ${{ github.sha }}
        body_path: .build/x86/RELEASE.md
        # releases/latest is this image: README / recreate script fetch
        # releases/latest/download/openwrt-x86-64-generic-squashfs-combined-efi.img.gz
        files: .build/x86/out/*

    - name: Remove old releases
      if: github.ref_name == github.event.repository.default_branch
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 5
        delete_tags: true
        # only the x86 VM releases; the MX5500 workflow prunes its own (mx5500_*)
        delete_tag_pattern: '^v'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
