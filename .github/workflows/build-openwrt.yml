name: Build OpenWrt

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: true
        default: 'false'
        type: choice
        options:
        - "true"
        - "false"
      version:
        description: 'OpenWrt version'
        required: true
        default: 'snapshot'
        type: string
      sing_box_version:
        description: 'Override /usr/bin/sing-box with an upstream SagerNet/sing-box release tag (e.g. v1.14.0-alpha.37). Leave blank to keep the OpenWrt package binary.'
        required: false
        default: 'v1.14.0'
        type: string
      sing_box_sha256:
        description: 'Optional: expected SHA256 of the sing-box .ipk. If set, the build fails on mismatch (tamper-evident pin). Leave blank to skip; the actual hash is printed in the log so you can pin it next time.'
        required: false
        default: 'cc37787354f4d455766a62c881b8999c6998808203986d4ae341e14981a2c891'
        type: string

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: master
  BUILD_ROOT: ${{ github.workspace }}/openwrt
  DEPENDENCIES: ${{ github.workspace }}/dependencies-ubuntu.txt
  CUSTOM_FEEDS_SH: ${{ github.workspace }}/custom-feeds.sh
  CUSTOM_PACKAGES_SH: ${{ github.workspace }}/custom-packages.sh
  CUSTOM_CONFIG_SH: ${{ github.workspace }}/custom-config.sh
  PREBUILD_MISC_SH: ${{ github.workspace }}/prebuild-misc.sh
  TZ: Asia/Shanghai
  DEVICE_NAME: unknown
  FILE_DATE: unknown
  FIRMWARE: unknown

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get -qq update && sudo apt-get -qq upgrade
        sudo apt-get -qq install $(cat $DEPENDENCIES)
        sudo apt-get -qq autoremove --purge
        sudo apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: Maximize build disk space
      uses: easimon/maximize-build-space@master
      with:
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true
        remove-docker-images: true

    - name: Checkout
      uses: actions/checkout@main

    - name: Download the sources
      run: git clone --branch $REPO_BRANCH $REPO_URL

    - name: Auto select a specific code revision
      id: autoselect
      if: github.event.client_payload.version == 'stable'
      run: |
        cd $BUILD_ROOT && git checkout $(git tag --sort=-creatordate | head -n1)
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Manual select a specific code revision
      id: manualselect
      if: github.event.inputs.version != null && github.event.inputs.version != 'snapshot'
      run: |
        cd $BUILD_ROOT && git checkout ${{ github.event.inputs.version }}
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Load custom
      run: |
        chmod +x *.sh
        $CUSTOM_FEEDS_SH
        $BUILD_ROOT/scripts/feeds update -a && $BUILD_ROOT/scripts/feeds install -a
        $CUSTOM_PACKAGES_SH
        $CUSTOM_CONFIG_SH
        $PREBUILD_MISC_SH

    - name: Override sing-box binary with upstream release
      if: github.event.inputs.sing_box_version != ''
      env:
        SB_VER: ${{ github.event.inputs.sing_box_version }}
        SB_SHA256: ${{ github.event.inputs.sing_box_sha256 }}
      run: |
        set -euo pipefail
        TAG="$SB_VER"                 # release tag, keep leading v (e.g. v1.14.0-alpha.37)
        VER="${TAG#v}"                # package version, strip leading v (e.g. 1.14.0-alpha.37)
        URL="https://github.com/SagerNet/sing-box/releases/download/${TAG}/sing-box_${VER}_openwrt_x86_64.ipk"
        echo "Downloading upstream sing-box: $URL"
        WORK="$(mktemp -d)"
        curl -fsSL -o "$WORK/sing-box.ipk" "$URL"
        # Integrity check: always print the actual hash; enforce it only if a pin was supplied.
        ACTUAL_SHA256="$(sha256sum "$WORK/sing-box.ipk" | cut -d' ' -f1)"
        echo "Downloaded .ipk sha256: $ACTUAL_SHA256"
        if [ -n "${SB_SHA256:-}" ]; then
          EXPECTED_SHA256="$(printf '%s' "$SB_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::sing-box .ipk sha256 mismatch: expected $EXPECTED_SHA256, got $ACTUAL_SHA256"
            exit 1
          fi
          echo "sha256 matches the pinned value."
        else
          echo "No sing_box_sha256 pin supplied; skipping enforcement (pin the hash above for a tamper-evident build)."
        fi
        # An .ipk is a gzip'd outer tar holding control.tar.gz + data.tar.gz + debian-binary.
        # Extract only the binary from data.tar.gz; do not install the package.
        tar -xzf "$WORK/sing-box.ipk" -C "$WORK" data.tar.gz
        tar -xzf "$WORK/data.tar.gz" -C "$WORK" ./usr/bin/sing-box
        # Drop it into the image files overlay so it overrides the packaged /usr/bin/sing-box.
        mkdir -p "$BUILD_ROOT/files/usr/bin"
        install -m 0755 "$WORK/usr/bin/sing-box" "$BUILD_ROOT/files/usr/bin/sing-box"
        echo "Custom sing-box staged into image overlay:"
        "$BUILD_ROOT/files/usr/bin/sing-box" version

    - name: Start SSH via tmate
      uses: rdp-studio/ssh2actions@main
      if: github.event.inputs.ssh == 'true'

    - name: Build the firmware image
      id: compile
      run: |
        cd $BUILD_ROOT && echo "$(($(nproc)+1)) thread compile"
        IGNORE_ERRORS=m make -j$(($(nproc)+1)) defconfig download clean world || IGNORE_ERRORS=m make -j1 defconfig download clean world V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_bin_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.BUILD_ROOT }}/bin

    - name: Organize files
      id: organize
      run: |
        cd $BUILD_ROOT/bin/targets/*/* && rm -rf packages
        { echo '### SHA256SUMS'; echo '```txt'; cat sha256sums; echo '```'; } > $BUILD_ROOT/SHA256SUMS
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware_${{ env.DEVICE_NAME }}_${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate stable Release Tag
      id: stabletag
      if: steps.autoselect.outputs.status == 'success' || steps.manualselect.outputs.status == 'success'
      run: |
        echo "release_tag=$(cd $BUILD_ROOT && git describe --tags --abbrev=0 --exact-match)_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Generate snapshot Release Tag
      id: snapshottag 
      if: github.event.inputs.version == 'snapshot'
      run: |
        echo "release_tag=SNAPSHOT_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload stable firmware to Release
      uses: softprops/action-gh-release@master
      if: steps.stabletag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.stabletag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
        body_path: ${{ env.BUILD_ROOT }}/SHA256SUMS

    - name: Upload snapshot firmware to Release
      uses: softprops/action-gh-release@master
      if: steps.snapshottag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.snapshottag.outputs.release_tag }}
        files: ${{ env.FIRMWARE }}/*
        body_path: ${{ env.BUILD_ROOT }}/SHA256SUMS

    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: Remove old Releases
      if: always()
      uses: dev-drprasad/delete-older-releases@master
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
